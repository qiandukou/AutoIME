; =================================================================
;  AutoIME 配置文件
;  改完保存后：右键托盘图标 -> 重新载入 AutoIME.ini
; =================================================================

[General]
; 总开关 1=开 0=关
Enabled=1
; ime    = 只开关输入法，不切换输入法（默认，推荐）
; layout = 切换到英文键盘布局（备用方案）
Method=ime
; 轮询间隔(毫秒)
PollIntervalMs=40
; 判定为输入框后，多久切中文(毫秒)
EnterDelayMs=30
; 离开输入框后，多久关闭输入法(毫秒)
LeaveDelayMs=350
; 你手动开关输入法后，程序暂停自动控制多久(毫秒)
ManualOverrideMs=4000
; 读取输入法状态的同步间隔(毫秒)
SyncIntervalMs=250
; 离开这些软件时，是否把输入法恢复成打开状态
RestoreOnLeave=1
; 1=严格锁定：不在输入框时强制关闭输入法，Shift 撬开也会立刻关回去
StrictLock=1
; 是否允许切换键盘布局（0=绝不切换键盘，只用开关输入法）
AllowLayoutSwitch=0
; 右下角状态提示
ShowBadge=1
; 是否在右下角通知区显示托盘图标（0=隐藏图标，程序仍后台运行；可在设置界面或全局设置快捷键里重新打开）
ShowTrayIcon=1
; 设置界面打开时是否在任务栏按钮区显示窗口按钮（后台运行本身不占任务栏）
ShowTaskbarButton=1
BadgeAlways=0
BadgeMs=1400
; 浮窗是否置顶
BadgeTopMost=1
; 锁定浮窗位置/大小（锁定后不能拖动、右下角不能缩放）
BadgeLocked=0
BadgeOpacity=0.93
; 浮窗尺寸/位置（可在浮窗上拖动、右下角缩放后自动保存；X/Y=-1 为默认右下角）
BadgeW=140
BadgeH=52
BadgeX=-1
BadgeY=-1
; 1=所有程序都生效，0=只对 [Apps] 里的程序生效
AllApps=0
; 仅在 Method=layout 时使用。auto=自动探测
ChineseHKL=0x08040804
EnglishHKL=0x08090809
LogLevel=1

[Apps]
; 生效的程序名（不含 .exe），=1 启用
Photoshop=1
3dsmax=1
3dsmaxb=1
3dsmaxio=1
maya=1
maya2020=1
maya2022=1
maya2023=1
maya2024=1
maya2025=1
maya2026=1
Illustrator=1
InDesign=1
InCopy=1
Adobe Premiere Pro=1
PremiereElementsEditor=1
AfterFX=1
Animate=1
Adobe Audition=1
Dreamweaver=1
Lightroom=1
Adobe Media Encoder=1
Adobe Bridge=1
Acrobat=1
AcroCEF=1
Adobe Substance 3D Designer=1
Substance 3D Painter=1
Substance 3D Sampler=1
Substance 3D Stager=1
Substance 3D Modeler=1
animator=1
acad=1
Revit=1
Navisworks=1
Inventor=1
Fusion=1
Alias=1
MotionBuilder=1
Mudbox=1
VREDPro=1
Powershape=1
Recap=1
DWGViewer=1

[Detect]
; 判定“鼠标在输入框里”的依据，可单独关闭以排查误判
; 标准 I 型光标（Maya 的 Qt 输入框、Windows 输入框等）
StdIBeam=1
; 光标形状像 I 型（用于 PS 自绘光标）
IBeamShape=0
; 放宽形状判定（允许更大的自绘 I 型光标，可能增加误判）
IBeamShapeLoose=0
; 存在文字插入符
CaretWindow=1
; 按窗口类名（Max 的 CustEdit 等）
UseClasses=1
; PS 的文字工具（画布打字）走 COM 判断，1=启用
PSToolRule=1
PSProcs=Photoshop,PhotoshopBeta
TextClasses=Edit,RICHEDIT,RichEdit20W,RichEdit20A,RICHEDIT50W,Scintilla,CustEdit,CustTextField,TextEditor
NumClasses=SpinnerControl,CustSpinner,msctls_updown32,SpinBox

[Keys]
; 全局快捷键: 修饰键 CTRL/ALT/SHIFT/WIN + 主键
Toggle=CTRL+ALT+SHIFT+I
Learn=CTRL+ALT+SHIFT+L
Diag=CTRL+ALT+SHIFT+D
; 打开设置主界面
Settings=CTRL+ALT+SHIFT+S
